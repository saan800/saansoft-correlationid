---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "05:00"
      timezone: "Australia/Perth"
    commit-message:
      prefix: "chore(github-actions): "
    labels:
      - "dependencies"
      - "no-release"
      - "no-release-notes"

  - package-ecosystem: nuget
    directory: "/"
    groups:
      AspNetCore:
        patterns:
          - Microsoft.AspNetCore*
        update-types: ["minor", "patch"]
      Microsoft:
        patterns:
          - Microsoft*
        update-types: ["minor", "patch"]
      System:
        patterns:
          - System*
        update-types: ["minor", "patch"]
      testing:
        patterns:
          - AutoFixture*
          - AwesomeAssertions*
          - coverlet.collector
          - coverlet.msbuild
          - GitHubActionsTestLogger
          - Microsoft.NET.Test.Sdk
          - xunit*
        update-types: ["minor", "patch"]
      testing-major:
        patterns:
          - AutoFixture*
          - AwesomeAssertions*
          - coverlet.collector
          - coverlet.msbuild
          - GitHubActionsTestLogger
          - Microsoft.NET.Test.Sdk
          - xunit*
        update-types: ["major"]
    schedule:
      interval: monthly
      time: "05:00"
      timezone: "Australia/Perth"
    commit-message:
      prefix: "dependencies(nuget): "
    labels:
      - "dependencies"
